[package]
name = "fairway_fdb_c"
version = "0.1.0"
edition = "2021"

[lib]
name = "fairway_fdb_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
fairway_fdb_core = { path = "../fairway_fdb_core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
once_cell = "1"
serde_json = "1"
foundationdb = { version = "0.9", features = ["embedded-fdb-include", "fdb-7_1"] }

[profile.release]
opt-level = 3
