[package]
name = "fairway_fdb_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "fairway_fdb_core"

[dependencies]
foundationdb = { version = "0.9", features = ["embedded-fdb-include", "fdb-7_1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
